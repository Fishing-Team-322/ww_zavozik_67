  /v1/companies/{companyId}/onec/discover:
    parameters:
    - $ref: '#/components/parameters/CompanyId'
    post:
      operationId: discoverOneCAccounting
      summary: Discover organizations and their accounts in an allowlisted 1C publication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [base_url]
              properties:
                base_url: {type: string}
                username: {type: string}
                password: {type: string}
      responses:
        '200':
          description: Source-verified organization/account relationships, not legal ownership
          content:
            application/json:
              schema:
                type: object
                required: [organizations]
                properties:
                  organizations:
                    type: array
                    items:
                      type: object
                      required: [name, inn, accounts]
                      properties:
                        name: {type: string}
                        inn: {type: string}
                        accounts:
                          type: array
                          items:
                            type: object
                            required: [number, name, verified_in_source]
                            properties:
                              number: {type: string}
                              name: {type: string}
                              verified_in_source: {type: boolean}
        default:
          $ref: '#/components/responses/Error'
  /v1/companies/{companyId}/registry:
    parameters:
    - $ref: '#/components/parameters/CompanyId'
    get:
      operationId: listRegistryDocuments
      summary: Saved registry profiles and document history for the owned workspace
      responses:
        '200':
          description: Registry profiles, never bank operations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistryDocument'
        default:
          $ref: '#/components/responses/Error'
  /v1/companies/{companyId}/registry/preview:
    parameters:
    - $ref: '#/components/parameters/CompanyId'
    post:
      operationId: previewRegistryDocument
      summary: Parse one official text PDF, XML or ZIP without linking a legal entity
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '200':
          description: A preview valid for 30 minutes, scoped to this workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryPreview'
        default:
          $ref: '#/components/responses/Error'
  /v1/companies/{companyId}/registry/confirm:
    parameters:
    - $ref: '#/components/parameters/CompanyId'
    post:
      operationId: confirmRegistryDocument
      summary: Explicitly link a preview; own-company target requires matching INN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [preview_id, record_index, target]
              properties:
                preview_id: {type: string, format: uuid}
                record_index: {type: integer, minimum: 0}
                target: {type: string, enum: [company, counterparty]}
      responses:
        '200':
          description: Idempotently saved profile, never proof of ownership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryDocument'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    RegistryDocument:
      type: object
      required: [inn, ogrn, name, actual_at, source, source_format, signature_status]
      properties:
        id: {type: string, format: uuid}
        inn: {type: string}
        ogrn: {type: string}
        name: {type: string}
        actual_at: {type: string}
        source: {type: string}
        source_format: {type: string}
        registration_status: {type: string}
        signature_status: {type: string, enum: [NOT_VERIFIED]}
        target: {type: string, enum: [company, counterparty]}
        ownership_verified: {type: boolean, enum: [false]}
        bank_account_verified: {type: boolean, enum: [false]}
    RegistryPreview:
      type: object
      required: [id, records, expires_at]
      properties:
        id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
        records:
          type: array
          items:
            $ref: '#/components/schemas/RegistryDocument'
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
          description: Текст для пользователя
    Health:
      type: object
      required:
      - status
      - ml
      properties:
        status:
          type: string
          enum:
          - ok
        ml:
          type: string
          enum:
          - ok
          - unavailable
          description: Без ML работает встроенный фолбэк
    Credentials:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 256
    RegisterRequest:
      type: object
      required:
      - email
      - password
      - consent_pd
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 256
        consent_pd:
          type: boolean
          enum:
          - true
    Token:
      type: object
      required:
      - access_token
      - expires_at
      properties:
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
    Company:
      type: object
      required:
      - id
      - name
      - inn
      - legal_form
      - industry
      - tax_regime
      - reserve
      - default_horizon
      - data_as_of
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 300
        inn:
          type: string
          nullable: true
          pattern: ^[0-9]{10}([0-9]{2})?$
        legal_form:
          type: string
          enum:
          - ООО
          - ИП
        industry:
          type: string
          minLength: 1
          maxLength: 120
        tax_regime:
          $ref: '#/components/schemas/TaxRegime'
        reserve:
          type: number
          format: double
          minimum: 0
          maximum: 99999999999999.98
          description: Рубли, точность до копейки
        default_horizon:
          type: integer
          enum:
          - 30
          - 60
          - 90
        data_as_of:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CompanyCreate:
      type: object
      required:
      - name
      - legal_form
      - industry
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 300
        inn:
          type: string
          nullable: true
          pattern: ^[0-9]{10}([0-9]{2})?$
        legal_form:
          type: string
          enum:
          - ООО
