openapi: 3.0.3
info:
  title: Zavozik Cashflow API
  version: 0.1.0
  description: |
    Контракт фронт ↔ Go-бэкенд. Источник правды: из него генерируются
    хендлеры на Go (oapi-codegen) и клиент на фронте.
    Суммы — в рублях, number с двумя знаками. Даты — YYYY-MM-DD.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []

tags:
  - name: system
  - name: auth
  - name: companies
  - name: sources
  - name: operations
  - name: forecast
  - name: events
  - name: scenarios
  - name: alerts

paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      security: []
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/models:
    get:
      tags: [forecast]
      operationId: listModels
      security: []
      summary: Доступные прогнозные модели (из ML-сервиса + встроенный фолбэк)
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModelInfo" }

  /v1/models/quality:
    get:
      tags: [forecast]
      operationId: getModelQuality
      security: []
      summary: Метрики бэктеста для страницы «Как мы считаем»
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModelQuality" }

  /v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        default:
          $ref: "#/components/responses/Error"
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/companies:
    get:
      tags: [companies]
      operationId: listCompanies
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Company" }
    post:
      tags: [companies]
      operationId: createCompany
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyCreate" }
      responses:
        default:
          $ref: "#/components/responses/Error"
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }

  /v1/companies/{companyId}/sources:
    parameters: [{ $ref: "#/components/parameters/CompanyId" }]
    get:
      tags: [sources]
      operationId: listSources
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Source" }
    post:
      tags: [sources]
      operationId: createSource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceCreate" }
      responses:
        default:
          $ref: "#/components/responses/Error"
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }

  /v1/sources/{sourceId}/sync:
    parameters:
      - name: sourceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [sources]
      operationId: syncSource
      responses:
        default:
          $ref: "#/components/responses/Error"
        "202":
          description: Синхронизация поставлена в очередь
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }

  /v1/companies/{companyId}/uploads:
    parameters: [{ $ref: "#/components/parameters/CompanyId" }]
    post:
      tags: [sources]
      operationId: uploadStatement
      summary: Загрузка выписки (1CClientBankExchange, Excel, CSV)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        default:
          $ref: "#/components/responses/Error"
        "202":
          description: Обработка поставлена в очередь
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }

  /v1/jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [sources]
      operationId: getJob
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }

  /v1/companies/{companyId}/operations:
    parameters: [{ $ref: "#/components/parameters/CompanyId" }]
    get:
      tags: [operations]
      operationId: listOperations
      parameters:
        - { name: category, in: query, schema: { $ref: "#/components/schemas/Category" } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationPage" }

  /v1/operations/{operationId}:
    parameters:
      - name: operationId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [operations]
      operationId: updateOperation
      summary: Пользователь меняет категорию
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              properties:
                category: { $ref: "#/components/schemas/Category" }
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operation" }

  /v1/companies/{companyId}/recurring:
    parameters: [{ $ref: "#/components/parameters/CompanyId" }]
    get:
      tags: [operations]
      operationId: listRecurring
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecurringPattern" }

  /v1/recurring/{patternId}:
    parameters:
      - name: patternId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [operations]
      operationId: updateRecurring
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed: { type: boolean }
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecurringPattern" }

  /v1/companies/{companyId}/counterparties:
    parameters: [{ $ref: "#/components/parameters/CompanyId" }]
    get:
      tags: [operations]
      operationId: listCounterparties
      summary: Контрагенты с рейтингом платёжной дисциплины
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Counterparty" }

  /v1/companies/{companyId}/forecast:
    parameters: [{ $ref: "#/components/parameters/CompanyId" }]
    get:
      tags: [forecast]
      operationId: getForecast
      parameters:
        - { name: horizon, in: query, schema: { type: integer, default: 30, minimum: 7, maximum: 90 } }
        - { name: model, in: query, schema: { type: string, default: auto } }
        - { name: scenario, in: query, schema: { type: string, format: uuid } }
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Forecast" }

  /v1/companies/{companyId}/gaps/{gapId}:
    parameters:
      - { $ref: "#/components/parameters/CompanyId" }
      - name: gapId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [forecast]
      operationId: getGap
      summary: Разрыв с причинами и рекомендациями
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GapDetail" }

  /v1/companies/{companyId}/retro:
    parameters: [{ $ref: "#/components/parameters/CompanyId" }]
    get:
      tags: [forecast]
      operationId: getRetro
      summary: «Мы бы вас предупредили» — прошлые разрывы и как рано мы бы их увидели
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Retro" }

  /v1/companies/{companyId}/plan-fact:
    parameters: [{ $ref: "#/components/parameters/CompanyId" }]
    get:
      tags: [forecast]
      operationId: getPlanFact
      parameters:
        - name: granularity
          in: query
          schema: { type: string, enum: [day, week], default: day }
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlanFactPoint" }

  /v1/companies/{companyId}/events:
    parameters: [{ $ref: "#/components/parameters/CompanyId" }]
    get:
      tags: [events]
      operationId: listEvents
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlannedEvent" }
    post:
      tags: [events]
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlannedEventCreate" }
      responses:
        default:
          $ref: "#/components/responses/Error"
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlannedEvent" }

  /v1/companies/{companyId}/events/parse:
    parameters: [{ $ref: "#/components/parameters/CompanyId" }]
    post:
      tags: [events]
      operationId: parseEvent
      summary: Разбор фразы «клиент обещал 300к 20-го» в черновик события
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 500 }
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: Черновик, пользователь подтверждает через createEvent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlannedEventCreate" }

  /v1/events/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [events]
      operationId: updateEvent
      summary: Изменение события (перенос даты drag&drop, сумма)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlannedEventUpdate" }
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlannedEvent" }
    delete:
      tags: [events]
      operationId: deleteEvent
      responses:
        default:
          $ref: "#/components/responses/Error"
        "204": { description: Deleted }

  /v1/companies/{companyId}/scenarios:
    parameters: [{ $ref: "#/components/parameters/CompanyId" }]
    get:
      tags: [scenarios]
      operationId: listScenarios
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Scenario" }
    post:
      tags: [scenarios]
      operationId: createScenario
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScenarioCreate" }
      responses:
        default:
          $ref: "#/components/responses/Error"
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Scenario" }

  /v1/companies/{companyId}/scenarios/{scenarioId}/compare:
    parameters:
      - { $ref: "#/components/parameters/CompanyId" }
      - name: scenarioId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [scenarios]
      operationId: compareScenario
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: Базовый и сценарный прогноз на одном графике
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioComparison" }

  /v1/companies/{companyId}/alerts:
    parameters: [{ $ref: "#/components/parameters/CompanyId" }]
    get:
      tags: [alerts]
      operationId: listAlerts
      responses:
        default:
          $ref: "#/components/responses/Error"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Alert" }


  /v1/auth/refresh:
    post:
      tags:
      - auth
      operationId: refresh
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        default:
          $ref: '#/components/responses/Error'
      security: []
  /v1/auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/password/forgot:
    post:
      tags:
      - auth
      operationId: forgotPassword
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      security: []
  /v1/auth/password/reset:
    post:
      tags:
      - auth
      operationId: resetPassword
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      security: []
  /v1/auth/providers:
    get:
      tags:
      - auth
      operationId: listAuthProviders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProviders'
        default:
          $ref: '#/components/responses/Error'
      security: []
  /v1/auth/oauth/{provider}/start:
    parameters:
    - name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OAuthProvider'
    get:
      tags:
      - auth
      operationId: startOAuth
      responses:
        '302':
          description: Browser redirect; HttpOnly cookie is set
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        default:
          $ref: '#/components/responses/Error'
      security: []
      parameters:
      - name: consent_pd
        in: query
        required: true
        schema:
          type: boolean
  /v1/auth/oauth/{provider}/callback:
    parameters:
    - name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OAuthProvider'
    get:
      tags:
      - auth
      operationId: finishOAuth
      responses:
        '302':
          description: Browser redirect; HttpOnly cookie is set
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        default:
          $ref: '#/components/responses/Error'
      security: []
      parameters:
      - name: code
        in: query
        schema:
          type: string
      - name: state
        in: query
        schema:
          type: string
      - name: error
        in: query
        schema:
          type: string
  /v1/me:
    get:
      tags:
      - auth
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        default:
          $ref: '#/components/responses/Error'
  /v1/me/password:
    patch:
      tags:
      - auth
      operationId: changePassword
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
  /v1/me/sessions:
    get:
      tags:
      - auth
      operationId: listSessions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessions'
        default:
          $ref: '#/components/responses/Error'
  /v1/me/sessions/{sessionId}:
    parameters:
    - name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      tags:
      - auth
      operationId: revokeSession
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/Error'
  /v1/companies/{companyId}:
    parameters:
    - $ref: '#/components/parameters/CompanyId'
    get:
      tags:
      - companies
      operationId: getCompany
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - companies
      operationId: updateCompany
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyPatch'
    delete:
      tags:
      - companies
      operationId: deleteCompany
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyDeleteRequest'
  /v1/companies/{companyId}/state:
    parameters:
    - $ref: '#/components/parameters/CompanyId'
    get:
      tags:
      - companies
      operationId: getCompanyState
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyState'
        default:
          $ref: '#/components/responses/Error'
    put:
      tags:
      - companies
      operationId: putCompanyState
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyState'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyStateWrite'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string, description: Текст для пользователя }

    Health:
      type: object
      required: [status, ml]
      properties:
        status: { type: string, enum: [ok] }
        ml: { type: string, enum: [ok, unavailable], description: Без ML работает встроенный фолбэк }

    Credentials:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 256
    RegisterRequest:
      type: object
      required:
      - email
      - password
      - consent_pd
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 256
        consent_pd:
          type: boolean
          enum:
          - true
    Token:
      type: object
      required:
      - access_token
      - expires_at
      properties:
        access_token:
          type: string
        expires_at:
          type: string
          format: date-time
    Company:
      type: object
      required:
      - id
      - name
      - inn
      - legal_form
      - industry
      - tax_regime
      - reserve
      - default_horizon
      - data_as_of
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 300
        inn:
          type: string
          nullable: true
          pattern: ^[0-9]{10}([0-9]{2})?$
        legal_form:
          type: string
          enum:
          - ООО
          - ИП
        industry:
          type: string
          minLength: 1
          maxLength: 120
        tax_regime:
          $ref: '#/components/schemas/TaxRegime'
        reserve:
          type: number
          format: double
          minimum: 0
          maximum: 99999999999999.98
          description: Рубли, точность до копейки
