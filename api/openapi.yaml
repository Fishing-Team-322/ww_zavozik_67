          - 90
    CompanyDeleteRequest:
      type: object
      required:
      - confirm_name
      properties:
        confirm_name:
          type: string
          minLength: 1
    Profile:
      type: object
      required:
      - id
      - email
      - role
      - created_at
      - companies
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - owner
          - admin
        created_at:
          type: string
          format: date-time
        companies:
          type: array
          items:
            $ref: '#/components/schemas/Company'
    Session:
      type: object
      required:
      - id
      - device
      - city
      - created_at
      - last_seen_at
      - expires_at
      - current
      properties:
        id:
          type: string
          format: uuid
        device:
          type: string
        city:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
    Sessions:
      type: array
      items:
        $ref: '#/components/schemas/Session'
    ForgotPasswordRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required:
      - token
      - new_password
      properties:
        token:
          type: string
        new_password:
          type: string
          minLength: 8
          maxLength: 256
    ChangePasswordRequest:
      type: object
      required:
      - old_password
      - new_password
      properties:
        old_password:
          type: string
        new_password:
          type: string
          minLength: 8
          maxLength: 256
    OAuthProvider:
      type: string
      enum:
      - google
      - yandex
    AuthProviders:
      type: array
      items:
        $ref: '#/components/schemas/OAuthProvider'
    CompanyState:
      type: object
      required:
      - company_id
      - version
      - data
      - updated_at
      properties:
        company_id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 0
        data:
          type: object
          additionalProperties: true
        updated_at:
          type: string
          format: date-time
    CompanyStateWrite:
      type: object
      required:
      - expected_version
      - data
      properties:
        expected_version:
          type: integer
          format: int64
          minimum: 0
        data:
          type: object
          additionalProperties: true

    TaxRegime:
      type: string
      enum: [usn6, usn15, osno, eshn, unknown]

    SourceKind:
      type: string
      enum: [upload, onec_bank_file, excel, gsheets, onec_odata, fns, manual]

    Source:
      type: object
      required: [id, kind, status]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/SourceKind" }
        title: { type: string }
        status: { type: string, enum: [ok, syncing, error, disabled] }
        last_synced_at: { type: string, format: date-time }
        error: { type: string }

    SourceCreate:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/SourceKind" }
        title: { type: string }
        config:
          type: object
          additionalProperties: true
          description: Например, spreadsheet_id для gsheets. Секреты здесь не возвращаются.

    Job:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, running, done, failed] }
        error: { type: string }

    Category:
      type: string
      description: Категория операции
      enum:
        - revenue_acquiring
        - revenue_sbp
        - revenue_cash
        - revenue_b2b
        - revenue_marketplace
        - supplier
        - salary
        - tax
        - rent
        - utilities
        - loan_payment
        - leasing
        - bank_fee
        - marketing
        - services
        - own_transfer
        - owner_loan
        - refund
        - enforcement
        - other

    Direction:
      type: string
      enum: [in, out]

    Operation:
      type: object
      required: [id, date, amount, direction, category, source]
      properties:
        id: { type: string }
        date: { type: string, format: date }
        amount: { type: number }
        direction: { $ref: "#/components/schemas/Direction" }
        counterparty_name: { type: string }
        counterparty_inn: { type: string }
        purpose: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        category_method: { type: string, enum: [rule, ml, llm, user] }
        is_internal: { type: boolean, description: Свои переводы и займы учредителя — не выручка }
        source: { $ref: "#/components/schemas/SourceKind" }

    OperationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Operation" }
        next_cursor: { type: string }

    RecurringPattern:
      type: object
      required: [id, title, category, period, amount, next_date, confirmed]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, description: "«Зарплата (аванс)», «Аренда — АО Арендодатель»" }
        category: { $ref: "#/components/schemas/Category" }
        direction: { $ref: "#/components/schemas/Direction" }
        counterparty_name: { type: string }
        period: { type: string, enum: [weekly, biweekly, monthly, quarterly] }
        day_of_month: { type: integer }
        amount: { type: number }
        amount_spread: { type: number, description: Типичное отклонение суммы }
        next_date: { type: string, format: date }
        confirmed: { type: boolean }

    Counterparty:
      type: object
      required: [name, total_in, total_out]
      properties:
        name: { type: string }
        inn: { type: string }
        total_in: { type: number }
        total_out: { type: number }
        avg_payment_delay_days: { type: number, description: От даты УПД до оплаты }
        discipline_score: { type: number, minimum: 0, maximum: 100 }
        overdue_amount: { type: number }

    ModelInfo:
      type: object
      required: [name, description, is_default]
      properties:
        name: { type: string }
        description: { type: string }
        is_default: { type: boolean }

    ModelQuality:
      type: object
      required: [model]
      properties:
        model: { type: string }
        mae_7: { type: number }
        mae_14: { type: number }
        mae_30: { type: number }
        wape_30: { type: number }
        gap_precision: { type: number }
        gap_recall: { type: number }
        gap_lead_days: { type: number, description: За сколько дней в среднем предупредили }

    ForecastComponent:
      type: object
      required: [key, title, amount]
      properties:
        key: { type: string, description: "Например: salary, tax, rent, event:<id>, stochastic" }
        title: { type: string }
        amount: { type: number, description: Со знаком; минус — списание }
        source: { $ref: "#/components/schemas/SourceKind" }

    ForecastPoint:
      type: object
      required: [date, p10, p50, p90]
      properties:
        date: { type: string, format: date }
        p10: { type: number }
        p50: { type: number }
        p90: { type: number }
        components:
          type: array
          items: { $ref: "#/components/schemas/ForecastComponent" }

    Gap:
      type: object
      required: [id, date, shortfall, probability]
      properties:
        id: { type: string }
        date: { type: string, format: date, description: "Первый день, когда остаток ниже резерва" }
        shortfall: { type: number, description: "Сколько не хватит (медиана), руб." }
        shortfall_p90: { type: number, description: Пессимистичная оценка }
        probability: { type: number, minimum: 0, maximum: 1 }
        headline: { type: string, description: «28 ноября не хватит ~340 000 ₽ на ЕНП и зарплату» }

    Forecast:
      type: object
      required: [as_of, horizon, model_used, opening_balance, safe_to_spend, headline, points, gaps]
      properties:
        as_of: { type: string, format: date }
        horizon: { type: integer }
        model_used: { type: string }
        low_confidence: { type: boolean }
        opening_balance: { type: number }
        safe_to_spend: { type: number, description: Можно потратить сегодня без риска уйти ниже резерва }
        headline: { type: string }
        status: { type: string, enum: [ok, warning, danger] }
        points:
          type: array
          items: { $ref: "#/components/schemas/ForecastPoint" }
        gaps:
          type: array
          items: { $ref: "#/components/schemas/Gap" }

    Cause:
      type: object
      required: [title, amount]
      properties:
        title: { type: string }
        amount: { type: number, description: "Вклад в разрыв, со знаком" }
        component_key: { type: string }

    Action:
      type: object
      required: [id, kind, title, effect]
      properties:
        id: { type: string }
        kind: { type: string, enum: [remind_client, shift_supplier_payment, overdraft, split_payment, cut_expense] }
        title: { type: string }
        description: { type: string }
        cost: { type: number, description: "Стоимость действия, например проценты" }
        effect:
          type: object
          required: [closes_gap, new_probability]
          properties:
            closes_gap: { type: boolean }
            new_probability: { type: number }
            new_shortfall: { type: number }
        draft_message: { type: string, description: Готовый текст напоминания клиенту }

    GapDetail:
      allOf:
        - $ref: "#/components/schemas/Gap"
        - type: object
          required: [causes, actions]
          properties:
            causes:
              type: array
              items: { $ref: "#/components/schemas/Cause" }
            actions:
              type: array
              items: { $ref: "#/components/schemas/Action" }

    Retro:
      type: object
      required: [events, detected, avg_lead_days, owner_injections_total]
      properties:
        events: { type: integer, description: Сколько прошлых разрывов найдено }
        detected: { type: integer, description: О скольких мы бы предупредили }
        avg_lead_days: { type: number }
        owner_injections_total: { type: number, description: Сколько владелец докладывал своих денег }
        items:
          type: array
          items:
            type: object
            required: [date, amount, kind]
            properties:
              date: { type: string, format: date }
              amount: { type: number }
              kind: { type: string, enum: [owner_loan, own_transfer, overdraft, below_reserve] }
              warned_days_before: { type: integer, nullable: true }

    PlanFactPoint:
      type: object
      required: [period, plan_in, plan_out, fact_in, fact_out]
      properties:
        period: { type: string, format: date }
        plan_in: { type: number }
        plan_out: { type: number }
        fact_in: { type: number }
        fact_out: { type: number }
        missed_events:
          type: array
          items: { $ref: "#/components/schemas/PlannedEvent" }

    PlannedEvent:
      type: object
      required: [id, date, amount, direction, title, source, status]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        amount: { type: number }
        direction: { $ref: "#/components/schemas/Direction" }
        title: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        counterparty_name: { type: string }
        probability: { type: number, minimum: 0, maximum: 1, default: 1 }
        source: { $ref: "#/components/schemas/SourceKind" }
        status: { type: string, enum: [expected, received, missed, cancelled] }

    PlannedEventCreate:
      type: object
      required: [date, amount, direction, title]
      properties:
        date: { type: string, format: date }
        amount: { type: number, minimum: 0 }
        direction: { $ref: "#/components/schemas/Direction" }
        title: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        counterparty_name: { type: string }
        probability: { type: number, minimum: 0, maximum: 1 }

    PlannedEventUpdate:
      type: object
      properties:
        date: { type: string, format: date }
        amount: { type: number, minimum: 0 }
        probability: { type: number, minimum: 0, maximum: 1 }
        status: { type: string, enum: [expected, received, missed, cancelled] }

    ScenarioStep:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [delay_counterparty, scale_revenue, add_expense, scale_fixed_costs, move_event]
        counterparty_name: { type: string }
        delay_days: { type: integer }
        factor: { type: number, description: "0.8 = −20%" }
        amount: { type: number }
        date: { type: string, format: date }
        event_id: { type: string, format: uuid }

    Scenario:
      type: object
      required: [id, title, steps]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        preset: { type: boolean }
        steps:
          type: array
          items: { $ref: "#/components/schemas/ScenarioStep" }

    ScenarioCreate:
      type: object
      required: [title, steps]
      properties:
        title: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/ScenarioStep" }

    ScenarioComparison:
      type: object
      required: [base, scenario]
      properties:
        base: { $ref: "#/components/schemas/Forecast" }
        scenario: { $ref: "#/components/schemas/Forecast" }

    Alert:
      type: object
      required: [id, created_at, severity, title]
      properties:
        id: { type: string }
        created_at: { type: string, format: date-time }
        severity: { type: string, enum: [info, warning, danger] }
        title: { type: string }
        body: { type: string }
        gap_id: { type: string }
        read: { type: boolean }
