          - 30
          - 60
          - 90
    CompanyPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 300
        inn:
          type: string
          nullable: true
          pattern: ^[0-9]{10}([0-9]{2})?$
        legal_form:
          type: string
          enum:
          - ООО
          - ИП
        industry:
          type: string
          minLength: 1
          maxLength: 120
        tax_regime:
          $ref: '#/components/schemas/TaxRegime'
        reserve:
          type: number
          format: double
          minimum: 0
          maximum: 99999999999999.98
          description: Рубли, точность до копейки
        default_horizon:
          type: integer
