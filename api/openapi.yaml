openapi: 3.0.3
info:
  title: Zavozik Cashflow API
  version: 0.3.0
  description: 'Контракт фронт ↔ Go-бэкенд. Источник правды: из него генерируются

    хендлеры на Go (oapi-codegen) и клиент на фронте.

    Суммы — в рублях, number с двумя знаками. Даты — YYYY-MM-DD.


    Product routes include durable jobs, per-company authorization, and explicit dependency errors.

    '
servers:
- url: http://localhost:8080
security:
- bearerAuth: []
tags:
- name: system
- name: auth
- name: companies
- name: sources
- name: operations
- name: forecast
- name: events
- name: scenarios
- name: alerts
paths:
  /healthz:
    get:
      tags:
      - system
      operationId: getHealth
      security: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/models:
    get:
      tags:
      - forecast
      operationId: listModels
      security: []
      summary: Доступные прогнозные модели (из ML-сервиса + встроенный фолбэк)
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelInfo'
  /v1/models/quality:
    get:
      tags:
      - product
      operationId: getModelQuality
      parameters: []
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelQuality'
      security: []
  /v1/auth/register:
    post:
      tags:
      - auth
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '409':
          $ref: '#/components/responses/Error'
  /v1/auth/login:
    post:
      tags:
      - auth
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/Error'
  /v1/companies:
    get:
      tags:
      - companies
      operationId: listCompanies
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
    post:
      tags:
      - companies
      operationId: createCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyCreate'
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
  /v1/companies/{companyId}/sources:
    get:
      tags:
      - product
      operationId: listSources
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Source'
    post:
      tags:
      - product
      operationId: createSource
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceInput'
  /v1/sources/{sourceId}/sync:
    post:
      tags:
      - product
      operationId: syncSource
      parameters:
      - name: sourceId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          $ref: '#/components/responses/Error'
        '202':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /v1/companies/{companyId}/uploads:
    post:
      tags:
      - product
      operationId: uploadStatement
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadMappingResult'
        '202':
          description: Import queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
  /v1/jobs/{jobId}:
    get:
      tags:
      - product
      operationId: getJob
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /v1/companies/{companyId}/operations:
    get:
      tags:
      - product
      operationId: listOperations
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: direction
        in: query
        required: false
        schema:
          type: string
      - name: category
        in: query
        required: false
        schema:
          type: string
      - name: counterparty_id
        description: Optional counterparty UUID. Omit to include all; legacy empty values are treated as absent. Invalid nonempty values return 400.
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: source
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationPage'
  /v1/operations/{operationId}:
    patch:
      tags:
      - product
      operationId: updateOperation
      parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOperationInput'
  /v1/companies/{companyId}/recurring:
    get:
      tags:
      - product
      operationId: listRecurring
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: direction
        in: query
        required: false
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecurringPattern'
    post:
      tags:
      - product
      operationId: createRecurring
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPattern'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecurringInput'
  /v1/recurring/{patternId}:
    patch:
      tags:
      - product
      operationId: updateRecurring
      parameters:
      - name: patternId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPattern'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecurringInput'
    delete:
      tags:
      - product
      operationId: deleteRecurring
      parameters:
      - name: patternId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          $ref: '#/components/responses/Error'
        '204':
          description: No content
  /v1/companies/{companyId}/counterparties:
    get:
      tags:
      - product
      operationId: listCounterparties
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: role
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Counterparty'
  /v1/companies/{companyId}/forecast:
    get:
      tags:
      - product
      operationId: getForecast
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: horizon
        in: query
        required: false
        schema:
          type: integer
      - name: model
        in: query
        required: false
        schema:
          type: string
      - name: scenario
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forecast'
  /v1/companies/{companyId}/gaps/{gapId}:
    get:
      tags:
      - product
      operationId: getGap
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: gapId
        in: path
        required: true
        schema:
          type: string
      - name: horizon
        in: query
        required: false
        schema:
          type: integer
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GapDetail'
  /v1/companies/{companyId}/retro:
    get:
      tags:
      - product
      operationId: getRetro
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Retro'
  /v1/companies/{companyId}/plan-fact:
    get:
      tags:
      - product
      operationId: getPlanFact
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: granularity
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanFactPoint'
  /v1/companies/{companyId}/events:
    get:
      tags:
      - product
      operationId: listEvents
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlannedEvent'
    post:
      tags:
      - product
      operationId: createEvent
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannedEvent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventInput'
  /v1/companies/{companyId}/events/parse:
    post:
      tags:
      - product
      operationId: parseEvent
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Object'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseEventInput'
  /v1/events/{eventId}:
    patch:
      tags:
      - product
      operationId: updateEvent
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlannedEvent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventInput'
    delete:
      tags:
      - product
      operationId: deleteEvent
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          $ref: '#/components/responses/Error'
        '204':
          description: No content
  /v1/companies/{companyId}/scenarios:
    get:
      tags:
      - product
      operationId: listScenarios
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Scenario'
    post:
      tags:
      - product
      operationId: createScenario
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        default:
          $ref: '#/components/responses/Error'
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScenarioInput'
  /v1/companies/{companyId}/scenarios/{scenarioId}/compare:
    get:
      tags:
      - product
      operationId: compareScenario
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: scenarioId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: horizon
        in: query
        required: false
        schema:
          type: integer
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioComparison'
  /v1/companies/{companyId}/alerts:
    get:
      tags:
      - product
      operationId: listAlerts
      parameters:
      - name: companyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: severity
        in: query
        required: false
        schema:
          type: string
      - name: kind
        in: query
        required: false
        schema:
          type: string
      - name: unread
        description: Omit for all alerts, true for unread, false for read. Legacy empty values are treated as absent.
        in: query
        required: false
        schema:
          type: boolean
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      responses:
        default:
          $ref: '#/components/responses/Error'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPage'
  /v1/auth/refresh:
    post:
      tags:
      - auth
      operationId: refresh
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        default:
          $ref: '#/components/responses/Error'
      security: []
  /v1/auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/Error'
  /v1/auth/password/forgot:
    post:
      tags:
      - auth
      operationId: forgotPassword
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      security: []
  /v1/auth/password/reset:
    post:
      tags:
      - auth
      operationId: resetPassword
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      security: []
  /v1/auth/providers:
    get:
      tags:
      - auth
      operationId: listAuthProviders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthProviders'
        default:
          $ref: '#/components/responses/Error'
      security: []
  /v1/auth/oauth/{provider}/start:
    parameters:
    - name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OAuthProvider'
    get:
      tags:
      - auth
      operationId: startOAuth
      responses:
        '302':
          description: Browser redirect; HttpOnly cookie is set
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        default:
          $ref: '#/components/responses/Error'
      security: []
      parameters:
      - name: consent_pd
        in: query
        required: true
        schema:
          type: boolean
  /v1/auth/oauth/{provider}/callback:
    parameters:
    - name: provider
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OAuthProvider'
    get:
      tags:
      - auth
      operationId: finishOAuth
      responses:
        '302':
          description: Browser redirect; HttpOnly cookie is set
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        default:
          $ref: '#/components/responses/Error'
      security: []
      parameters:
      - name: code
        in: query
        schema:
          type: string
      - name: state
        in: query
        schema:
          type: string
      - name: error
        in: query
        schema:
          type: string
  /v1/me:
    get:
      tags:
      - auth
      operationId: getMe
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        default:
          $ref: '#/components/responses/Error'
  /v1/me/password:
    patch:
      tags:
      - auth
      operationId: changePassword
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
  /v1/me/sessions:
    get:
      tags:
      - auth
      operationId: listSessions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessions'
        default:
          $ref: '#/components/responses/Error'
  /v1/me/sessions/{sessionId}:
    parameters:
    - name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      tags:
      - auth
      operationId: revokeSession
      responses:
        '204':
          description: No content
        default:
          $ref: '#/components/responses/Error'
  /v1/companies/{companyId}:
    parameters:
    - $ref: '#/components/parameters/CompanyId'
    get:
      tags:
      - companies
      operationId: getCompany
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags:
      - companies
      operationId: updateCompany
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
