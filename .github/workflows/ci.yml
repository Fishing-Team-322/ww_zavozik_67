name: ci

on:
  push:
    branches: [main, max-back]
  pull_request:

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zavozik_test
          POSTGRES_USER: zavozik_test
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zavozik_test -d zavozik_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://zavozik_test:test-only-password@localhost:5432/zavozik_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go generate ./internal/httpapi && bash ./scripts/gen-unimplemented.sh && git diff --exit-code -- internal/httpapi/api.gen.go internal/httpapi/unimplemented.gen.go internal/httpapi/product.gen.go
      - run: go vet ./...
      - run: go test -race ./...
      # Standalone integration packages migrate the same test schema.
      - run: go test -race -p 1 ./...
        working-directory: integrations

  ml:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zavozik_test
          POSTGRES_USER: zavozik_test
          POSTGRES_PASSWORD: test-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zavozik_test -d zavozik_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://zavozik_test:test-only-password@localhost:5432/zavozik_test?sslmode=disable
      TEST_ML_ADDR: 127.0.0.1:50051
      OMP_NUM_THREADS: "2"
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify Go API against the real Python models
        run: |
          PYTHONPATH=gen ML_LISTEN="$TEST_ML_ADDR" python -u -m zavozik_ml.serving.server > /tmp/zavozik-ml.log 2>&1 &
          ml_pid=$!
          trap 'kill "$ml_pid"; cat /tmp/zavozik-ml.log' EXIT
          python -c 'import grpc, os; grpc.channel_ready_future(grpc.insecure_channel(os.environ["TEST_ML_ADDR"])).result(timeout=30)'
          cd ../backend
          go test -race ./internal/httpapi -run '^TestLiveMLThroughFinancialAPI$' -count=1 -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: underfront
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: underfront/package-lock.json
      - run: npm ci
      - run: npm run gen:api && git diff --exit-code -- src/shared/api/schema.gen.ts
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint:api
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: case-acceptance
      PUBLIC_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:3000
      COOKIE_SECURE: "false"
      INTEGRATION_SANDBOX: "true"
      CATEGORIZER_MODE: hybrid
      E2E_ADMIN_EMAIL: ci-ui-admin@example.invalid
      E2E_ADMIN_PASSWORD: Synthetic-isolated-ci-admin-2026!
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: underfront/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure isolated acceptance stack
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Build and start all services from the clean checkout
        run: docker compose -f compose.yaml up -d --build
      - name: Wait for API and frontend
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/readyz >/dev/null && curl -fsS http://localhost:3000/login >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify financial path with the trained ML service
        run: python scripts/acceptance-smoke.py --require-ml --state /tmp/case-private-state.json --output acceptance-results/financial-path.json
      - name: Verify repeatable dataset seeding through the API
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
        env:
          PULS_SEED_TEST_API_URL: http://localhost:8080
      - run: npm ci
        working-directory: underfront
      - run: npx playwright install --with-deps chromium
        working-directory: underfront
      - name: Prepare a synthetic administrator only in the isolated acceptance database
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload = json.dumps({"email": os.environ["E2E_ADMIN_EMAIL"], "password": os.environ["E2E_ADMIN_PASSWORD"], "consent_pd": True}).encode()
          request = urllib.request.Request("http://localhost:8080/v1/auth/register", data=payload, headers={"Content-Type": "application/json"})
          with urllib.request.urlopen(request) as response:
              assert response.status == 201
          PY
          docker compose exec -T postgres psql -U zavozik -d zavozik -v ON_ERROR_STOP=1 -c "UPDATE users SET role='admin' WHERE email='ci-ui-admin@example.invalid';"
      - name: Browser acceptance on the isolated synthetic stack
        run: npm run test:e2e
        working-directory: underfront
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_API_URL: http://localhost:8080
          E2E_INTEGRATION_SANDBOX: "1"
      - name: Restart services without deleting the database
        run: |
          docker compose -f compose.yaml restart postgres ml api worker frontend
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/readyz >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify persistence after restart
        run: python scripts/acceptance-smoke.py --require-ml --verify-restart --state /tmp/case-private-state.json --output acceptance-results/persistence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case-acceptance
          path: |
            acceptance-results/
            underfront/test-results/
          if-no-files-found: warn
      - name: Stop isolated acceptance stack
        if: always()
        run: docker compose -f compose.yaml down --volumes
