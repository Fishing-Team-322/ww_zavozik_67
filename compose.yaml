name: zavozik

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zavozik
      POSTGRES_USER: zavozik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zavozik -d zavozik"]
      interval: 3s
      retries: 20

  ml:
    build: ./ml
    restart: unless-stopped
    environment:
      ML_LISTEN: 0.0.0.0:50051
      LOG_LEVEL: info

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { CMD: migrate }
    environment:
      DATABASE_URL: postgres://zavozik:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/zavozik?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { CMD: api, GIT_SHA: "${GIT_SHA:-unknown}" }
    environment: &backend-env
      HTTP_ADDR: :8080
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      DATABASE_URL: postgres://zavozik:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/zavozik?sslmode=disable
      ML_ADDR: ml:50051
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      LOG_LEVEL: info
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      SMTP_ADDR: ${SMTP_ADDR:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY in .env}
      SOURCE_ALLOWED_HOSTS: ${SOURCE_ALLOWED_HOSTS:-}
      DADATA_API_TOKEN: ${DADATA_API_TOKEN:-}
      CATEGORIZER_MODE: ${CATEGORIZER_MODE:-rules}
      TRAINING_URL: ${TRAINING_URL:-}
      TRAINING_TOKEN: ${TRAINING_TOKEN:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      ml: { condition: service_started }
      migrate: { condition: service_completed_successfully }

  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { CMD: worker, GIT_SHA: "${GIT_SHA:-unknown}" }
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      ml: { condition: service_started }
      migrate: { condition: service_completed_successfully }

  frontend:
    restart: unless-stopped
    build:
      context: ./underfront
      dockerfile: Dockerfile
      args:
        BACKEND_ORIGIN: http://api:8080
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      BACKEND_ORIGIN: http://api:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api: { condition: service_started }

  bot:
    profiles: [bot]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args: { CMD: bot }
    environment:
      <<: *backend-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
