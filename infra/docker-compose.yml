# Старый backend-only Compose. Весь проект запускается через ../compose.yaml.
# ML-сервис наружу не публикуется: доступен только api/worker внутри сети.
name: zavozik

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zavozik
      POSTGRES_USER: zavozik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zavozik}
    # Postgres нужен только сервисам внутри сети Compose; порт хоста не требуется.
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zavozik -d zavozik"]
      interval: 3s
      retries: 20

  ml:
    build: ../ml
    environment:
      ML_LISTEN: 0.0.0.0:50051
      LOG_LEVEL: info

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args: { CMD: api }
    environment: &backend-env
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://zavozik:${POSTGRES_PASSWORD:-zavozik}@postgres:5432/zavozik?sslmode=disable
      ML_ADDR: ml:50051
      JWT_SECRET: ${JWT_SECRET:-}
      LOG_LEVEL: info
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      SMTP_ADDR: ${SMTP_ADDR:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      SOURCE_ALLOWED_HOSTS: ${SOURCE_ALLOWED_HOSTS:-}
      DADATA_API_TOKEN: ${DADATA_API_TOKEN:-}
      CATEGORIZER_MODE: ${CATEGORIZER_MODE:-rules}
      TRAINING_URL: ${TRAINING_URL:-}
      TRAINING_TOKEN: ${TRAINING_TOKEN:-}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      ml: { condition: service_started }
      migrate: { condition: service_completed_successfully }

  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args: { CMD: migrate }
    environment:
      DATABASE_URL: postgres://zavozik:${POSTGRES_PASSWORD:-zavozik}@postgres:5432/zavozik?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args: { CMD: worker }
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      ml: { condition: service_started }
      migrate: { condition: service_completed_successfully }

  bot:
    profiles: [bot] # make up-bot, когда будет TELEGRAM_BOT_TOKEN
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args: { CMD: bot }
    environment:
      <<: *backend-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
