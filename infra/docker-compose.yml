# make up — поднять всё; make down — остановить.
# ML-сервис наружу не публикуется: доступен только api/worker внутри сети.
name: zavozik

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zavozik
      POSTGRES_USER: zavozik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zavozik}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zavozik -d zavozik"]
      interval: 3s
      retries: 20

  ml:
    build: ../ml
    environment:
      ML_LISTEN: 0.0.0.0:50051
      LOG_LEVEL: info

  api:
    build:
      context: ../backend
      args: { CMD: api }
    environment: &backend-env
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://zavozik:${POSTGRES_PASSWORD:-zavozik}@postgres:5432/zavozik?sslmode=disable
      ML_ADDR: ml:50051
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      LOG_LEVEL: info
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      ml: { condition: service_started }

  worker:
    build:
      context: ../backend
      args: { CMD: worker }
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      ml: { condition: service_started }

  bot:
    profiles: [bot] # make up-bot, когда будет TELEGRAM_BOT_TOKEN
    build:
      context: ../backend
      args: { CMD: bot }
    environment:
      <<: *backend-env
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
