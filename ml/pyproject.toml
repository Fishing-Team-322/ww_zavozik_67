[project]
name = "zavozik-ml"
version = "0.1.0"
description = "ML-сервис прогноза стохастической части денежного потока (gRPC)"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.84,<2",
    "protobuf>=7.35,<8", # gencode из grpcio-tools 1.84 требует runtime >= 7.35
    "numpy>=2.1",
    "pandas>=2.2",
    "lightgbm>=4.5",
    "statsmodels>=0.14",
    "scipy>=1.13", # обучение классификатора категорий (L-BFGS); уже тянется statsmodels
]

[project.optional-dependencies]
dev = ["grpcio-tools>=1.84,<2", "pytest>=8", "pyarrow>=17", "matplotlib>=3.9"]
# Эксперименты с нейросетями: ставится отдельно, в прод-образ не попадает.
train = ["torch>=2.5", "transformers>=4.48,<6", "safetensors>=0.5", "scikit-learn>=1.6", "onnx>=1.17", "onnxruntime>=1.20,<2", "onnxscript>=0.3"]
encoder = ["onnxruntime>=1.20,<2", "tokenizers>=0.21,<1"]
encoder-torch = ["torch>=2.5", "transformers>=4.48,<6", "safetensors>=0.5"]
discovery = ["torch>=2.5", "transformers>=4.48,<6", "safetensors>=0.5", "scikit-learn>=1.6"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zavozik_ml*"]

[tool.setuptools.package-data]
zavozik_ml = ["calendar_data/*.json", "classify_v2/*.json", "classify_v2/*.tsv"]

[tool.pytest.ini_options]
pythonpath = [".", "gen"]
testpaths = ["tests"]
