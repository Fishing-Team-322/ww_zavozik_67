[project]
name = "zavozik-ml"
version = "0.1.0"
description = "ML-сервис прогноза стохастической части денежного потока (gRPC)"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.84,<2",
    "protobuf>=7.35,<8", # gencode из grpcio-tools 1.84 требует runtime >= 7.35
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = ["grpcio-tools>=1.84,<2", "pytest>=8"]
# Обучение: ставится отдельно, в прод-образ не попадает.
train = ["pandas>=2.2", "pyarrow>=17", "torch>=2.5"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zavozik_ml*"]

[tool.pytest.ini_options]
pythonpath = [".", "gen"]
testpaths = ["tests"]
